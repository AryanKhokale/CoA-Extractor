services:
  - type: web
    name: coa-directory-extractor-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: COA_BASE_URL
        value: https://www.coa.gov.in
      - key: MAX_CONCURRENCY
        value: 5
      - key: REQUESTS_PER_SECOND
        value: 2.0
      - key: REQUEST_TIMEOUT
        value: 30
      - key: MAX_RETRIES
        value: 3
      - key: BATCH_SIZE
        value: 50
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
